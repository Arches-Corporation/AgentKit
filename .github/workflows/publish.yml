# Manual fallback publisher. The normal path publishes inside release.yml
# (releases created with the workflow GITHUB_TOKEN cannot trigger this workflow —
# GitHub's anti-recursion rule). Use this dispatch to (re)publish a specific tag,
# e.g. after a transient registry failure. Consumers install from the registry:
# see README + docs/onboarding.md for the .npmrc + token setup.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v2.0.0)
        required: true
  release:
    types: [published]   # still fires for manually-created releases

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@arches-corporation"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify from registry
        run: npm view @arches-corporation/agentkit@$(node -p "require('./package.json').version") version --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
