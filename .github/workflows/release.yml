name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@arches-corporation"
      - name: Self-gate — full test suite
        run: |
          git config --global user.email ci@arches && git config --global user.name ci
          npm test
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Tag or bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$LATEST_TAG" ]; then
            echo "package.json ($PKG_VERSION) ahead of latest tag ($LATEST_TAG) — tagging as-is"
            if git rev-parse "refs/tags/$PKG_VERSION" >/dev/null 2>&1; then
              echo "tag $PKG_VERSION already exists — skipping tag"
            else
              git tag "$PKG_VERSION"
              git push origin "$PKG_VERSION"
            fi
            gh release view "$PKG_VERSION" >/dev/null 2>&1 || \
              gh release create "$PKG_VERSION" --verify-tag --generate-notes --title "$PKG_VERSION"
            exit 0
          fi
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            MSGS="$(git log --pretty='%s' HEAD^1..HEAD^2; git log -1 --pretty='%b' | head -1)"
          else
            MSGS="$(git log --pretty='%s' '${{ github.event.before }}..HEAD' 2>/dev/null || git log -1 --pretty=%s)"
          fi
          BUMP=patch
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            case "$LINE" in
              *"!:"*|*BREAKING*)  BUMP=major; break ;;
              feat*)              [ "$BUMP" = patch ] && BUMP=minor ;;
            esac
          done <<< "$MSGS"
          echo "auto-bump: $BUMP (from commits in push:)"
          echo "$MSGS"
          NEW_VERSION="$(npm version "$BUMP" --no-git-tag-version)"
          BRANCH="release/$NEW_VERSION"
          git checkout -b "$BRANCH"
          git commit -am "chore(release): $NEW_VERSION"
          git push -u origin "$BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$HEAD_SHA" \
            -f state=success -f context=test \
            -f description="self-gated: npm test passed in the release workflow"
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"
          BODY="$(printf 'Automated %s bump. Commits in the triggering push:\n\n%s' "$BUMP" "$(echo "$MSGS" | sed 's/^/- /')")"
          gh pr create --base main --head "$BRANCH" --title "chore(release): $NEW_VERSION" --body "$BODY"
          gh pr merge "$BRANCH" --merge --delete-branch
          gh release create "$NEW_VERSION" --verify-tag --generate-notes --title "$NEW_VERSION"

      # Publish here, not via a release-event workflow: events created with the
      # workflow GITHUB_TOKEN never trigger other workflows, so publish.yml would
      # never fire for auto-created releases. Idempotent (skips published versions).
      # The working tree holds the released version in both paths (manual bump =
      # checkout; auto bump = npm version modified package.json above).
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          V="$(node -p "require('./package.json').version")"
          if npm view "@arches-corporation/agentkit@$V" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "version $V already on the registry — skipping publish"
          else
            npm publish
            npm view "@arches-corporation/agentkit@$V" version --registry=https://npm.pkg.github.com
          fi
