# One-shot permission canary for GitHub Packages: proves the workflow
# GITHUB_TOKEN can publish an npm package under the org (org package-creation
# setting). Publishes the CURRENT version under the org-matching scope
# @arches-corporation (GitHub Packages requires scope == owner org; the
# in-repo name @arches/agentkit cannot publish there). Branch-only workflow —
# not part of the release pipeline; folded into the real registry PR if the
# canary succeeds.
name: Publish Canary (GitHub Packages)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@arches-corporation"

      - name: Rename to org-matching scope
        run: npm pkg set name=@arches-corporation/agentkit

      - name: Dry-run (tarball sanity)
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify from registry
        run: npm view @arches-corporation/agentkit versions --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
